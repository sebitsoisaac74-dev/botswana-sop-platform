
spring:
  application:
    name: botswana-sop-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sop_platform}
    username: ${DB_USERNAME:sop_user}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

  error:
    include-message: never
    include-stacktrace: never
